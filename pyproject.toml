[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creeper"
version = "1.0.0"
description = "Observability service for the Evershade ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "LukaG712"}]
keywords = ["observability", "metrics", "traces", "logs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
    "prometheus-client==0.20.0",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
]

[project.urls]
Homepage = "https://github.com/LukaG712/Creeper"
Repository = "https://github.com/LukaG712/Creeper"

[project.optional-dependencies]
dev = ["pytest==8.3.0", "pytest-asyncio==0.24.0", "pytest-timeout==2.3.1", "ruff==0.9.0"]

[tool.setuptools.packages.find]
include = ["creeper*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
